name: 🎬 Video Pipeline — Відео пайплайн магів

on:
  schedule:
    - cron: '0 8 1,11,21 * *'   # LUNA — 1, 11, 21 числа
    - cron: '0 8 4,14,24 * *'   # ARCAS — 4, 14, 24 числа
    - cron: '0 8 7,17,27 * *'   # NUMI — 7, 17, 27 числа
    - cron: '0 8 10,20,30 * *'  # UMBRA — 10, 20, 30 числа
  workflow_dispatch:
    inputs:
      mage:
        description: 'Маг для запуску (luna/arcas/numi/umbra)'
        required: true
        default: 'luna'
        type: choice
        options:
          - luna
          - arcas
          - numi
          - umbra

jobs:
  video-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout репо
        uses: actions/checkout@v4

      - name: Визначити мага по дню місяця
        id: mage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.mage }}" >> $GITHUB_OUTPUT
          else
            DAY=$(date +%d)
            case $DAY in
              01|11|21) echo "name=luna" >> $GITHUB_OUTPUT ;;
              04|14|24) echo "name=arcas" >> $GITHUB_OUTPUT ;;
              07|17|27) echo "name=numi" >> $GITHUB_OUTPUT ;;
              10|20|30) echo "name=umbra" >> $GITHUB_OUTPUT ;;
              *) echo "Сьогодні не день публікації відео, виходимо" && exit 0 ;;
            esac
          fi

      - name: Встановити Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: content/video-pipeline/requirements.txt

      - name: Встановити залежності
        run: |
          pip install -r content/video-pipeline/requirements.txt

      - name: Створити папку output
        run: mkdir -p content/video-pipeline/output

      - name: Запустити пайплайн
        working-directory: content/video-pipeline
        env:
          # Anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # HeyGen
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_API_KEY_UMBRA: ${{ secrets.HEYGEN_API_KEY_UMBRA }}
          # ElevenLabs
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Twitter Academy
          ACADEMY_TWITTER_API_KEY: ${{ secrets.ACADEMY_TWITTER_API_KEY }}
          ACADEMY_TWITTER_API_SECRET: ${{ secrets.ACADEMY_TWITTER_API_SECRET }}
          ACADEMY_TWITTER_ACCESS_TOKEN: ${{ secrets.ACADEMY_TWITTER_ACCESS_TOKEN }}
          ACADEMY_TWITTER_ACCESS_SECRET: ${{ secrets.ACADEMY_TWITTER_ACCESS_SECRET }}
          # Telegram алерти
          TELEGRAM_ALERT_BOT_TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          LUMARA_TELEGRAM_CHANNEL_ID: ${{ secrets.LUMARA_TELEGRAM_CHANNEL_ID }}
          ADMIN_TELEGRAM_ID: "6127139155"
          # Telegram канали магів
          LUNA_TELEGRAM_BOT_TOKEN: ${{ secrets.LUNA_TELEGRAM_BOT_TOKEN }}
          LUNA_TELEGRAM_CHANNEL_ID: "-1003789392788"
          ARCAS_TELEGRAM_BOT_TOKEN: ${{ secrets.ARCAS_TELEGRAM_BOT_TOKEN }}
          ARCAS_TELEGRAM_CHANNEL_ID: "-1003764526911"
          NUMI_TELEGRAM_BOT_TOKEN: ${{ secrets.NUMI_TELEGRAM_BOT_TOKEN }}
          NUMI_TELEGRAM_CHANNEL_ID: "-1003955376716"
          UMBRA_TELEGRAM_BOT_TOKEN: ${{ secrets.UMBRA_TELEGRAM_BOT_TOKEN }}
          UMBRA_TELEGRAM_CHANNEL_ID: "-1003966644443"
          # Instagram (спільний токен)
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Meta акаунти магів
          LUNA_IG_USER_ID: ${{ secrets.LUNA_IG_USER_ID }}
          LUNA_PAGE_ACCESS_TOKEN: ${{ secrets.LUNA_PAGE_ACCESS_TOKEN }}
          LUNA_FB_PAGE_ID: ${{ secrets.LUNA_FB_PAGE_ID }}
          ARCAS_IG_USER_ID: ${{ secrets.ARCAS_IG_USER_ID }}
          ARCAS_PAGE_ACCESS_TOKEN: ${{ secrets.ARCAS_PAGE_ACCESS_TOKEN }}
          ARCAS_FB_PAGE_ID: ${{ secrets.ARCAS_FB_PAGE_ID }}
          NUMI_IG_USER_ID: ${{ secrets.NUMI_IG_USER_ID }}
          NUMI_PAGE_ACCESS_TOKEN: ${{ secrets.NUMI_PAGE_ACCESS_TOKEN }}
          NUMI_FB_PAGE_ID: ${{ secrets.NUMI_FB_PAGE_ID }}
          UMBRA_IG_USER_ID: ${{ secrets.UMBRA_IG_USER_ID }}
          UMBRA_PAGE_ACCESS_TOKEN: ${{ secrets.UMBRA_PAGE_ACCESS_TOKEN }}
          UMBRA_FB_PAGE_ID: ${{ secrets.UMBRA_FB_PAGE_ID }}
          # HeyGen Avatar (Photo) і Voice IDs
          LUNA_HEYGEN_PHOTO_IDS: ${{ secrets.LUNA_HEYGEN_PHOTO_IDS }}
          LUNA_HEYGEN_VOICE_ID: ${{ secrets.LUNA_HEYGEN_VOICE_ID }}
          ARCAS_HEYGEN_PHOTO_IDS: ${{ secrets.ARCAS_HEYGEN_PHOTO_IDS }}
          ARCAS_HEYGEN_VOICE_ID: ${{ secrets.ARCAS_HEYGEN_VOICE_ID }}
          NUMI_HEYGEN_PHOTO_IDS: ${{ secrets.NUMI_HEYGEN_PHOTO_IDS }}
          NUMI_HEYGEN_VOICE_ID: ${{ secrets.NUMI_HEYGEN_VOICE_ID }}
          UMBRA_HEYGEN_PHOTO_IDS: ${{ secrets.UMBRA_HEYGEN_PHOTO_IDS }}
          UMBRA_HEYGEN_VOICE_ID: ${{ secrets.UMBRA_HEYGEN_VOICE_ID }}
        run: python pipeline.py --mage ${{ steps.mage.outputs.name }}
